title: Credential Dump via Comsvcs MiniDump
id: c74b173a-dc9c-4813-bdf0-a0a818e27308
status: experimental
description: Detects abuse of comsvcs.dll MiniDump export to dump LSASS process memory, a known credential access technique.
references:
  - https://attack.mitre.org/techniques/T1003/001/
author: Cyberion Detection Engineering
date: 2026/04/04
tags:
  - attack.t1003.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    EventID: 1
    CommandLine|contains|all:
      - 'comsvcs'
      - 'MiniDump'
  condition: selection
falsepositives:
  - Legitimate diagnostic memory dump utilities
  - Some software troubleshooting tools
level: critical
