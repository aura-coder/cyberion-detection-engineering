title: Executable Download Followed by External Connection
id: 20000002-0002-0002-0002-000000000002
status: experimental
description: Correlation-style detection. An executable written to a Downloads directory followed closely by a network connection to an external IP. Indicates a download-and-execute chain (ingress tool transfer followed by C2 callback).
references:
  - https://attack.mitre.org/techniques/T1105/
  - https://attack.mitre.org/techniques/T1071/
author: Cyberion Detection Engineering
date: 2026/04/04
tags:
  - attack.t1105
  - attack.t1071
logsource:
  product: windows
detection:
  selection_file:
    EventID: 11
    TargetFilename|contains: '\Downloads\'
    TargetFilename|endswith:
      - '.exe'
      - '.dll'
      - '.scr'
  selection_network:
    EventID: 3
  condition: selection_network | near selection_file
falsepositives:
  - Legitimate software updaters downloading into Downloads then phoning home
  - Browser extensions with automatic update
level: high
