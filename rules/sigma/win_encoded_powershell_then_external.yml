title: Encoded PowerShell Then External Connection
id: 20000003-0003-0003-0003-000000000003
status: experimental
description: Correlation-style detection. Encoded PowerShell execution followed by an outbound network connection from the same process. Indicates a download cradle or C2 stager.
references:
  - https://attack.mitre.org/techniques/T1059/001/
  - https://attack.mitre.org/techniques/T1071/
author: Cyberion Detection Engineering
date: 2026/04/04
tags:
  - attack.t1059.001
  - attack.t1071
logsource:
  product: windows
detection:
  selection_powershell:
    EventID: 1
    Image|endswith: '\powershell.exe'
    CommandLine|contains:
      - '-EncodedCommand'
      - '-enc '
      - '-e '
  selection_network:
    EventID: 3
    Image|endswith: '\powershell.exe'
  condition: selection_network | near selection_powershell
falsepositives:
  - Legitimate admin scripts that call home after execution
  - Software management frameworks
level: high
