title: PowerShell Encoded Command Execution
id: 3998e9c6-eb83-4c1d-bbed-f98557fc85f2
status: experimental
description: Detects PowerShell with encoded command execution, commonly used to obfuscate malicious scripts.
references:
  - https://attack.mitre.org/techniques/T1059/001/
  - https://attack.mitre.org/techniques/T1027/
author: Cyberion Detection Engineering
date: 2026/04/04
tags:
  - attack.t1059.001
  - attack.t1027
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    EventID: 1
    Image|endswith: '\powershell.exe'
    CommandLine|contains:
      - '-EncodedCommand'
      - '-enc '
      - '-e '
  condition: selection
falsepositives:
  - Legitimate administrative scripts using encoded commands
  - Software installers that invoke PowerShell with encoded arguments
level: medium
