title: WMI Process with Impacket-Style Output Redirect
id: 10000002-0002-0002-0002-000000000002
status: experimental
description: Detects WmiPrvSE.exe spawning cmd.exe with output redirected to an ADMIN$ or C$ share, characteristic of Impacket wmiexec.py and similar remote execution tools.
references:
  - https://attack.mitre.org/techniques/T1047/
  - https://attack.mitre.org/techniques/T1021/006/
author: Cyberion Detection Engineering
date: 2026/04/04
tags:
  - attack.t1047
  - attack.t1021.006
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|endswith: '\WmiPrvSE.exe'
    CommandLine|contains:
      - '\\127.0.0.1\ADMIN$\'
      - '\\127.0.0.1\C$\'
      - '\\localhost\ADMIN$\'
      - '\\localhost\C$\'
  condition: selection
falsepositives:
  - Legitimate management scripts using WMI with SMB output capture
  - SCCM client operations
level: high
