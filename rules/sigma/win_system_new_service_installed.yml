title: New Windows Service Installed
id: f766a0f4-5a12-4c9c-81f8-512e7807f5c4
status: experimental
description: Detects installation of a new Windows service via Service Control Manager event 7045, a common persistence and privilege escalation technique.
references:
  - https://attack.mitre.org/techniques/T1543/003/
author: Cyberion Detection Engineering
date: 2026/04/04
tags:
  - attack.t1543.003
logsource:
  product: windows
  service: system
detection:
  selection:
    EventID: 7045
  condition: selection
falsepositives:
  - Legitimate software installation
  - Driver installations
  - Antivirus or endpoint agent updates
level: medium
