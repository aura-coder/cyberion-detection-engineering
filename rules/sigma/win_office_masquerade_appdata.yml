title: Office Binary Running From User AppData
id: a0ce1428-af05-4226-862a-04ddd69dc605
status: experimental
description: Detects Office executables (WINWORD, EXCEL, POWERPNT, OUTLOOK) running from AppData or user-writable locations, a common masquerading technique used by macro droppers and loaders.
references:
  - https://attack.mitre.org/techniques/T1036/005/
author: Cyberion Detection Engineering
date: 2026/04/04
tags:
  - attack.t1036.005
logsource:
  category: process_creation
  product: windows
detection:
  selection_image:
    Image|endswith:
      - '\WINWORD.EXE'
      - '\EXCEL.EXE'
      - '\POWERPNT.EXE'
      - '\OUTLOOK.EXE'
  selection_path:
    Image|contains:
      - '\AppData\'
      - '\Temp\'
      - '\Downloads\'
      - '\Public\'
  condition: selection_image and selection_path
falsepositives:
  - Portable Office installs (rare, non-standard)
  - Click-to-Run virtualized Office deployments in some configurations
level: critical
