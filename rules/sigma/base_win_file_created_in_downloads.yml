title: Base - Executable Created in Downloads Folder
id: 42b364a6-651f-48de-b1d9-08b526cf7ea1
status: test
name: base_win_file_created_in_downloads
description: Base selection for correlation - Sysmon EID 11 where an executable lands in a Downloads folder.
author: Cyberion Detection Engineering
date: 2026/04/04
logsource:
  category: file_event
  product: windows
detection:
  selection:
    EventID: 11
    TargetFilename|contains: '\\Downloads\\'
    TargetFilename|endswith:
      - '.exe'
      - '.dll'
      - '.scr'
  condition: selection
level: informational
